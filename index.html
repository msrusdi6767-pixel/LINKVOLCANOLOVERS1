            border: 1px solid rgba(255, 215, 0, 0.4);

            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .volcano-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,215,0,0.3) 0%, transparent 60%);
            transform: scale(0);
            transition: transform 0.5s ease-out;
        }

        .volcano-btn:hover::before {
            transform: scale(1);
        }

        .volcano-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 30px rgba(255, 69, 0, 0.7), 0 0 15px rgba(255, 215, 0, 0.6);
            border-color: rgba(255, 215, 0, 0.8);
        }

        .volcano-btn:active {
            transform: translateY(1px) scale(0.99);
        }

        /* Glowing Pulse Animation */

            50% { opacity: 1; filter: drop-shadow(0 0 25px #ff7f50); }
        }

        .lava-glow {
            animation: lavaPulse 3s infinite ease-in-out;

    <!-- Interactive Canvas Animation Script -->
    <script>
        const canvas = document.getElementById('volcano-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 65;

        // Resize Canvas to Window Size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Ember Particle Class
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 3.5 + 1;
                this.speedY = Math.random() * 1.8 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.opacity = Math.random() * 0.8 + 0.2;
                
                // Fire colors: Red, Orange, Yellow
                const colors = [
                    'rgba(255, 69, 0, ',    // Red-Orange
                    'rgba(255, 140, 0, ',   // Dark Orange
                    'rgba(255, 215, 0, ',   // Gold/Yellow
                    'rgba(200, 30, 0, '     // Deep Red
                ];
                this.colorBase = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.01) * 0.3;
                this.opacity -= 0.003;

                // Reset particle when off-screen or faded
                if (this.y < -10 || this.opacity <= 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.colorBase + this.opacity + ')';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff4500';
                ctx.fill();
                ctx.shadowBlur = 0; // Reset blur for performance
            }
        }

        // Initialize Ember Particles
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                const p = new Particle();
                p.y = Math.random() * canvas.height; // Spread initially across height
                particles.push(p);
            }
        }

        // Animation Loop
        function animate() {
            // Draw dark gradient background on canvas
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0a0302');
            grad.addColorStop(0.7, '#140503');
            grad.addColorStop(1, '#250803');
            
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update & Draw Particles
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        // Start Animation on Page Load
        window.onload = function () {
            initParticles();
            animate();
        };
    </script>
